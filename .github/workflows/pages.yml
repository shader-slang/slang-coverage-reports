name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Test Pages staging
        run: python3 -m unittest discover -s tools/tests -v

      - name: Stage published reports
        env:
          REPORT_REVISION: ${{ github.sha }}
          PAGES_DIRECTORY: ${{ runner.temp }}/coverage-pages
        run: |
          python3 tools/stage-pages.py --revision "$REPORT_REVISION" --output "$PAGES_DIRECTORY"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/coverage-pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
